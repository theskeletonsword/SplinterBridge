[workspace]
resolver = "2"
members = [
    "crates/splinter-proto",
    "crates/splinter-filter",
    "crates/splinter-safety",
    "crates/splinter-core",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["TheSkeletonSword <skels@splinterbridge.org>"]
license = "Apache-2.0"
repository = "https://github.com/TheSkeletonSword/SplinterBridge"
homepage = "https://github.com/TheSkeletonSword/SplinterBridge"
readme = "README.md"
description = "SplinterBridge: Zero-Trust S2S Partitioned Federation Engine for Sovereign Social Backends"

[workspace.dependencies]
# Async runtime & gRPC
tokio = { version = "1.40", features = ["full"] }
tonic = { version = "0.12", features = ["tls", "transport", "prost"] }
tonic-build = "0.12"
protoc-bin-vendored = "3"
zeroize = "1"
prost = "0.13"
prost-types = "0.13"

# Cryptography & Zero-Knowledge Attestation
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"

# TLS & Cryptographic primitives
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
aws-lc-rs = "1.9"

# Serialization & Pattern Matching
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aho-corasick = "1.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal workspace crates
splinter-proto = { path = "crates/splinter-proto" }
splinter-filter = { path = "crates/splinter-filter" }
splinter-safety = { path = "crates/splinter-safety" }
splinter-core = { path = "crates/splinter-core" }
